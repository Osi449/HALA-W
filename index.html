<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هلا تمويل — قيد التحديث</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;}
.box{text-align:center;padding:40px 30px;}
.logo{font-size:48px;margin-bottom:16px;}
h1{font-size:22px;font-weight:800;margin-bottom:10px;color:#A78BFA;}
p{font-size:14px;color:rgba(255,255,255,0.6);line-height:1.8;}
.badge{display:inline-block;margin-top:20px;padding:8px 20px;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);border-radius:20px;font-size:12px;color:#A78BFA;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">⚙️</div>
  <h1>الموقع قيد التحديث</h1>
  <p>نعمل على تحسين المنصة<br>سيعود الموقع قريباً بتجربة أفضل</p>
  <div class="badge">🔧 Under Maintenance</div>
</div>
</body>
</html>
