<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>هلا تمويل — My List</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="mylist-team.js?v=20261010b"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;direction:rtl;background:#FAFAFA;color:#1A1A2E;}
.topbar{background:linear-gradient(135deg,#6B21A8,#7C3AED);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.content{max-width:700px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px;}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(107,33,168,0.10);}
.client-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(107,33,168,0.10);border-right:4px solid #9CA3AF;margin-bottom:10px;}
.client-card.fb-pos{border-right-color:#22C55E;background:#F0FDF4;}
.client-card.fb-neg{border-right-color:#DC2626;background:#FEF2F2;}
.client-card.fb-warn{border-right-color:#D97706;background:#FFFBEB;}
.client-card.fb-info{border-right-color:#1D4ED8;background:#EFF6FF;}
.cc-top{padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.cc-name{font-size:14px;font-weight:700;color:#1A1A2E;margin-bottom:5px;}
.cc-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.cc-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:700;}
.cc-amount{font-size:16px;font-weight:900;color:#6B21A8;}
.cc-period{font-size:10px;color:#9CA3AF;}
.cc-meta{padding:0;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#9CA3AF;}
.cc-fb-row{padding:10px 16px;border-top:1px solid #E5E7EB;}
.cc-fb-label{font-size:10px;color:#9CA3AF;font-weight:700;margin-bottom:5px;}
.fb-select{width:100%;padding:9px 10px;border-radius:9px;border:1.5px solid #DDD6FE;font-size:12.5px;font-family:'Cairo',sans-serif;color:#1A1A2E;background:#FAFAFA;}
.cc-actions{padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid #E5E7EB;}
.btn-action{padding:7px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;white-space:nowrap;}
.btn-call{padding:7px 10px;background:#166534;border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:3px;}
.btn-wa{padding:7px 10px;background:#25D366;border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:3px;}
.btn-call2{background:#6B21A8;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;}
.fbtn{padding:6px 14px;border-radius:20px;border:1px solid #E5E7EB;background:#fff;font-size:12px;cursor:pointer;font-family:'Cairo',sans-serif;color:#4B5563;}
.fbtn.active{background:#6B21A8;color:#fff;border-color:#6B21A8;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(107,33,168,0.10);}
.stat-n{font-size:20px;font-weight:900;}
.stat-l{font-size:9px;color:#9CA3AF;}
#no-auth{min-height:100vh;background:linear-gradient(135deg,#6B21A8,#7C3AED);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
.sel-input{width:100%;padding:9px 10px;border-radius:9px;border:1.5px solid #DDD6FE;font-size:12.5px;font-family:'Cairo',sans-serif;color:#1A1A2E;background:#fff;}
#mgrBtn{position:fixed;bottom:20px;left:16px;z-index:1500;display:none;align-items:center;gap:8px;padding:12px 18px;background:linear-gradient(135deg,#6B21A8,#7C3AED);border:none;border-radius:30px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,0.35);}
#mgrPanel{position:fixed;inset:0;z-index:2200;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:16px;}
.mgr-box{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;}
table.rep{width:100%;border-collapse:collapse;font-size:12px;}
table.rep th{padding:6px 8px;text-align:center;background:#F5F3FF;}
table.rep th:first-child{text-align:right;}
table.rep td{padding:6px 8px;text-align:center;border-bottom:1px solid #F3F4F6;}
table.rep td:first-child{text-align:right;font-weight:700;}
</style>
</head>
<body>

<div id="no-auth" style="display:none;">
  <div>
    <div style="font-size:52px;margin-bottom:16px;">🔐</div>
    <div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:8px;">يجب تسجيل الدخول أولاً</div>
    <a href="index.html" style="display:inline-block;margin-top:16px;padding:12px 28px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;font-size:14px;font-weight:700;text-decoration:none;">الذهاب للرئيسية</a>
  </div>
</div>

<div id="main-content">
<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px;">
    <svg width="30" height="30" viewBox="0 0 60 60" fill="none"><rect width="60" height="60" rx="14" fill="rgba(255,255,255,0.15)"/><path d="M14 44V16h8v11h16V16h8v28h-8V35H22v9H14z" fill="#C4B5FD"/><circle cx="46" cy="16" r="5" fill="#22C55E"/></svg>
    <span style="color:#fff;font-size:14px;font-weight:700;">📋 My List — العملاء المؤهلون</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span id="user-name" style="background:rgba(255,255,255,0.12);border-radius:20px;padding:3px 12px;font-size:11px;color:rgba(255,255,255,0.9);"></span>
    <a href="index.html" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:5px 12px;color:#fff;font-size:12px;text-decoration:none;">🏠</a>
  </div>
</div>

<div class="content">
  <!-- Stats -->
  <div class="stats" id="stats-row">
    <div class="stat"><div class="stat-n" id="s-total" style="color:#6B21A8;">0</div><div class="stat-l">إجمالي</div></div>
    <div class="stat"><div class="stat-n" id="s-pending" style="color:#9CA3AF;">0</div><div class="stat-l">بانتظار التواصل</div></div>
    <div class="stat"><div class="stat-n" id="s-contacted" style="color:#1D4ED8;">0</div><div class="stat-l">تم التواصل</div></div>
    <div class="stat"><div class="stat-n" id="s-success" style="color:#166534;">0</div><div class="stat-l">نجح الطلب 🏆</div></div>
  </div>

  <!-- Filter by Category -->
  <div class="card" style="padding:12px 16px;">
    <div style="font-size:11px;color:#9CA3AF;font-weight:700;margin-bottom:8px;letter-spacing:1px;">فلتر حسب التصنيف</div>
    <div class="filter-bar" id="type-filter-bar">
      <button class="fbtn active" onclick="setTypeFilter('all')">الكل</button>
      <button class="fbtn" onclick="setTypeFilter('New')" style="color:#065F46;">New</button>
      <button class="fbtn" onclick="setTypeFilter('Renewal')" style="color:#1D4ED8;">Renewal</button>
      <button class="fbtn" onclick="setTypeFilter('Top Up')" style="color:#D97706;">Top Up</button>
      <button class="fbtn" onclick="setTypeFilter('Decline')" style="color:#DC2626;">Decline</button>
    </div>
  </div>

  <!-- Filter by Feedback -->
  <div class="card" style="padding:12px 16px;">
    <div style="font-size:11px;color:#9CA3AF;font-weight:700;margin-bottom:8px;letter-spacing:1px;">فلتر حسب الفيدباك</div>
    <select class="sel-input" id="fb-filter" onchange="setFbFilter(this.value)">
      <option value="all">الكل</option>
      <option value="__none__">⬜ لم يُحدَّد</option>
    </select>
  </div>

  <!-- Entity ID Search -->
  <div class="card" style="padding:12px 16px;">
    <div style="font-size:11px;color:#9CA3AF;font-weight:700;margin-bottom:8px;letter-spacing:1px;">🔍 بحث بالـ Entity ID / TID / الاسم</div>
    <div style="display:flex;gap:8px;">
      <input id="entity-search" type="text" placeholder="أدخل Entity ID أو TID أو جزء من الاسم..."
        style="flex:1;background:#FAFAFA;border:1.5px solid #DDD6FE;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;font-family:monospace;color:#6B21A8;direction:ltr;outline:none;"
        oninput="filterByEntity(this.value)" onkeydown="if(event.key==='Escape'){this.value='';filterByEntity('');}">
      <button onclick="clearEntitySearch()" style="padding:10px 16px;background:#F5F3FF;border:1.5px solid #DDD6FE;border-radius:10px;color:#6B21A8;font-size:13px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;">✕ مسح</button>
    </div>
    <div id="entity-search-result" style="font-size:12px;color:#9CA3AF;margin-top:6px;min-height:16px;"></div>
  </div>

  <!-- List -->
  <div id="clients-list"></div>
</div>
</div>

<!-- MANAGER BUTTON -->
<button id="mgrBtn" onclick="openMgrPanel()">📊 نتائج الفريق</button>

<!-- MANAGER PANEL -->
<div id="mgrPanel">
  <div class="mgr-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="font-size:16px;font-weight:800;color:#6B21A8;">📊 نتائج الفريق — My List</div>
      <button onclick="closeMgrPanel()" style="background:#F3F4F6;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:'Cairo',sans-serif;">✕</button>
    </div>
    <div id="mgrContent" style="font-size:13px;color:#1A1A2E;">جاري التحميل...</div>
    <button onclick="exportMgrExcel()" style="width:100%;margin-top:16px;padding:12px;background:linear-gradient(135deg,#166534,#15803D);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;">⬇️ تحميل تقرير كامل (Excel)</button>
  </div>
</div>

<script>
// ── Supabase ──────────────────────────────
const SB='https://ggmvlrwbmnuvnnrojrcs.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnbXZscndibW51dm5ucm9qcmNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTI2MjYsImV4cCI6MjA5MzI4ODYyNn0.fSfgSVe_7nI_XzWY3L25gy86HLAxC0e99RdRdMGD_kY';
const SH={'Content-Type':'application/json',apikey:SK,Authorization:'Bearer '+SK};
async function dbGet(t,q=''){const r=await fetch(SB+'/rest/v1/'+t+q,{headers:SH});if(!r.ok)throw new Error(await r.text());return r.json();}
async function dbUp(t,b,c){const r=await fetch(SB+'/rest/v1/'+t+'?on_conflict='+c,{method:'POST',headers:{...SH,Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}

// ── Auth ─────────────────────────────────
let mlUser=null;
try{const u=localStorage.getItem('hu5');if(u)mlUser=JSON.parse(u);}catch(e){}

if(!mlUser){
  document.getElementById('main-content').style.display='none';
  document.getElementById('no-auth').style.display='flex';
} else {
  document.getElementById('user-name').textContent=mlUser.name;
}

const isSup=mlUser&&(mlUser.role==='supervisor'||mlUser.role==='region'||mlUser.role==='owner');

const EMP_NAMES={
  'W1-JH':'Jabir Mohammed Hassan','W2-HM':'Haitham Mahmoud Mohamed','W3-MH':'Mohammed Hamid',
  'W8-MA':'Mustafa Amanullah','W10-AA':'Abdullah Abdulqayyum','W11-KS':'Khalil Alsayigh',
  'W12-SF':'Shadi Fahad Alghamdi','S3-MM':'Marwan Mohammed'
};

// WhatsApp message — same template used across the platform
const WA_NAME_OVERRIDE={'W10-AA':'Abdullah Sheikh'};
function waMsgText(){
  const nm=WA_NAME_OVERRIDE[mlUser&&mlUser.code]||((mlUser&&mlUser.name)?mlUser.name:'');
  return 'مرحباً، معك '+nm+'، ممثل مبيعات التمويل في هلا للتمويل 👋\nيمكنك الآن التقديم على طلب التمويل خلال دقائق بكل سهولة عبر موقعنا.\nإذا كنت مهتم أو ترغب بمعرفة تفاصيل أكثر، يسعدني تواصلك معي.\nشكراً لك 🌟';
}

// ── Feedback options ──────────────────────
const FEEDBACK_OPTIONS=[
  'تم التواصل – العميل مهتم',
  'تم التواصل – العميل غير مهتم',
  'تم التواصل – طلب التواصل لاحقًا',
  'تم التواصل – سيتم إرسال المستندات',
  'تم التواصل – المستندات ناقصة',
  'تم التواصل – العميل غير مؤهل',
  'تم التواصل – العميل لديه طلب قائم',
  'تم التواصل – العميل حصل على تمويل',
  'تم رفع طلب التمويل بنجاح',
  'تعذّر رفع طلب التمويل',
  'توجد مشكلة تقنية',
  'لم يتم الرد',
  'الجوال مغلق',
  'الجوال خارج نطاق التغطية',
  'الرقم غير صحيح',
  'تم إرسال رسالة واتساب',
  'تمت محاولة التواصل أكثر من مرة',
  'بانتظار رد العميل',
  'متابعة لاحقة',
  'لا يرغب في التواصل',
  'سجل تجاري مكرر',
  'تم إغلاق الحالة'
];
const FEEDBACK_POS=new Set(['تم التواصل – العميل مهتم','تم رفع طلب التمويل بنجاح']);
const FEEDBACK_NEG=new Set(['تم التواصل – العميل غير مهتم','تعذّر رفع طلب التمويل','لا يرغب في التواصل','الرقم غير صحيح','سجل تجاري مكرر']);
const FEEDBACK_INFO=new Set(['تم التواصل – العميل غير مؤهل','تم التواصل – العميل لديه طلب قائم','تم التواصل – العميل حصل على تمويل','تم إغلاق الحالة']);
function fbClass(v){
  if(!v)return'';
  if(FEEDBACK_POS.has(v))return' fb-pos';
  if(FEEDBACK_NEG.has(v))return' fb-neg';
  if(FEEDBACK_INFO.has(v))return' fb-info';
  return' fb-warn';
}

// Populate feedback filter dropdown
(function(){
  const sel=document.getElementById('fb-filter');
  FEEDBACK_OPTIONS.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o);});
})();

// Category badge colors
const CAT_COLORS={'New':{bg:'#D1FAE5',color:'#065F46'},'Renewal':{bg:'#DBEAFE',color:'#1D4ED8'},'Top Up':{bg:'#FEF3C7',color:'#D97706'},'Decline':{bg:'#FEE2E2',color:'#DC2626'}};
const GRADE_COLORS={'A':{bg:'#D1FAE5',color:'#166534'},'B':{bg:'#DBEAFE',color:'#1D4ED8'},'C':{bg:'#FEF3C7',color:'#D97706'},'D':{bg:'#F3F4F6',color:'#6B7280'},'C&D':{bg:'#F3F4F6',color:'#6B7280'}};

// ── State ─────────────────────────────────
let currentTypeFilter='all';
let currentFbFilter='all';
let feedback={}; // entityId -> feedback value
let notes={}; // entityId -> notes text
let entitySearchTerm='';
let showLimit=100;
const PAGE=100;
function showMore(){showLimit+=PAGE;renderList();}

function getClients(){
  if(!mlUser||!window.MY_LIST)return[];
  if(isSup)return Object.values(window.MY_LIST).flatMap(z=>z);
  return window.MY_LIST[mlUser.code]||[];
}

function setTypeFilter(f){
  currentTypeFilter=f;showLimit=PAGE;
  document.querySelectorAll('#type-filter-bar .fbtn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  renderList();
}
function setFbFilter(f){currentFbFilter=f;showLimit=PAGE;renderList();}

function renderList(){
  const all=getClients();
  let filtered = entitySearchTerm ? all.filter(c =>
    (c.entityId||'').toUpperCase().includes(entitySearchTerm) ||
    (c.tid||'').toUpperCase().includes(entitySearchTerm) ||
    (c.name||'').toUpperCase().includes(entitySearchTerm)
  ) : all;

  if(currentTypeFilter!=='all')filtered=filtered.filter(c=>c.category===currentTypeFilter);
  if(currentFbFilter==='__none__')filtered=filtered.filter(c=>!feedback[c.entityId]);
  else if(currentFbFilter!=='all')filtered=filtered.filter(c=>feedback[c.entityId]===currentFbFilter);

  // Stats (on full set, not filtered)
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-pending').textContent=all.filter(c=>!feedback[c.entityId]).length;
  document.getElementById('s-contacted').textContent=all.filter(c=>feedback[c.entityId]).length;
  document.getElementById('s-success').textContent=all.filter(c=>feedback[c.entityId]==='تم رفع طلب التمويل بنجاح').length;

  const list=document.getElementById('clients-list');
  if(!filtered.length){list.innerHTML='<div style="text-align:center;padding:40px;background:#fff;border-radius:14px;"><div style="font-size:36px;margin-bottom:8px;">📭</div><div style="color:#9CA3AF;">لا يوجد عملاء</div></div>';return;}

  const totalFiltered=filtered.length;
  const visible=filtered.slice(0,showLimit);
  list.innerHTML=visible.map(c=>{
    const fb=feedback[c.entityId]||'';
    const nt=notes[c.entityId]||'';
    const catStyle=CAT_COLORS[c.category]||{bg:'#F3F4F6',color:'#4B5563'};
    const gradeStyle=GRADE_COLORS[c.grade]||null;
    const waMsg=encodeURIComponent(waMsgText());
    const notesBlock = isSup
      ? `<div class="cc-fb-row"><div class="cc-fb-label">ملاحظات الموظف</div><div style="font-size:12.5px;color:${nt?'#1A1A2E':'#9CA3AF'};background:#FAFAFA;border:1.5px solid #E5E7EB;border-radius:9px;padding:9px 10px;min-height:18px;white-space:pre-wrap;">${sanitize(nt)||'لا توجد ملاحظات'}</div></div>`
      : `<div class="cc-fb-row"><div class="cc-fb-label">ملاحظات</div><textarea class="fb-select" rows="2" placeholder="اكتب ملاحظة..." onchange="setNotes('${c.entityId}',this.value)">${sanitize(nt)}</textarea></div>`;
    return`<div class="client-card${fbClass(fb)}" id="cc-${c.entityId}">
      <div class="cc-top">
        <div style="flex:1;">
          <div class="cc-name">${c.name}</div>
          <div class="cc-badges">
            <span class="cc-badge" style="background:${catStyle.bg};color:${catStyle.color};">${c.category}</span>
            ${gradeStyle?`<span class="cc-badge" style="background:${gradeStyle.bg};color:${gradeStyle.color};">فئة ${c.grade}</span>`:''}
          </div>
          <div class="cc-meta">
            <span>📋 TID: ${c.tid||'—'}</span>
            <span>🆔 ${c.entityId}</span>
            <span>🗺️ ${c.zone}</span>
          </div>
        </div>
        <div style="text-align:left;">
          <div class="cc-amount">${c.amount?Number(c.amount).toLocaleString('ar-SA'):'—'}</div>
          <div class="cc-period">ريال</div>
        </div>
      </div>
      <div class="cc-fb-row">
        <div class="cc-fb-label">الفيدباك</div>
        <select class="fb-select" onchange="setFeedback('${c.entityId}',this.value)">
          <option value="">⬜ لم يُحدَّد</option>
          ${FEEDBACK_OPTIONS.map(f=>`<option value="${f}"${fb===f?' selected':''}>${f}</option>`).join('')}
        </select>
      </div>
      ${notesBlock}
      <div class="cc-actions">
        ${c.cashier?`<a href="tel:${c.cashier}" class="btn-call">📞 محاسب</a>
        <a href="https://wa.me/966${(c.cashier||'').replace(/^\+?966/,'').replace(/^0/,'')}?text=${waMsg}" target="_blank" class="btn-wa">💬 واتساب محاسب</a>`:''}
        ${c.owner?`<a href="tel:${c.owner}" class="btn-call btn-call2">📞 مدير</a>
        <a href="https://wa.me/966${(c.owner||'').replace(/^\+?966/,'').replace(/^0/,'')}?text=${waMsg}" target="_blank" class="btn-wa">💬 واتساب مدير</a>`:''}
      </div>
    </div>`;
  }).join('')+(totalFiltered>visible.length?`<button onclick="showMore()" style="width:100%;padding:12px;margin-bottom:10px;background:#F5F3FF;border:1.5px solid #DDD6FE;border-radius:12px;color:#6B21A8;font-size:13px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;">عرض المزيد (${visible.length} من ${totalFiltered})</button>`:'');
}

async function setFeedback(entityId, value){
  const prev=feedback[entityId];
  if(!value){
    // treat as clear: just update local state, nothing meaningful to delete server-side needed beyond leaving last value;
    // simplest: skip server write on clear (keeps last known value), re-render unaffected
    return;
  }
  feedback[entityId]=value;
  renderList();
  try{
    await dbUp('mylist_feedback',{entity_id:entityId,emp_code:mlUser.code,feedback:value,notes:notes[entityId]||null,updated_at:new Date().toISOString()},'entity_id');
  }catch(e){
    console.error(e);
    feedback[entityId]=prev;
    renderList();
    alert('⚠️ تعذّر حفظ الفيدباك، تأكد من الاتصال بالإنترنت وحاول مرة أخرى');
  }
}

async function setNotes(entityId, value){
  const prev=notes[entityId];
  notes[entityId]=value;
  try{
    await dbUp('mylist_feedback',{entity_id:entityId,emp_code:mlUser.code,feedback:feedback[entityId]||null,notes:value,updated_at:new Date().toISOString()},'entity_id');
  }catch(e){
    console.error(e);
    notes[entityId]=prev;
    renderList();
    alert('⚠️ تعذّر حفظ الملاحظة، تأكد من الاتصال بالإنترنت وحاول مرة أخرى');
  }
}

function sanitize(str){
  if(!str)return'';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
}

// ── Entity Search ─────────────────────────
function filterByEntity(val){
  entitySearchTerm=val.trim().toUpperCase();showLimit=PAGE;
  renderList();
  const res=document.getElementById('entity-search-result');
  if(entitySearchTerm){
    const all=getClients();
    const found=all.filter(c=>(c.entityId||'').toUpperCase().includes(entitySearchTerm)||(c.tid||'').toUpperCase().includes(entitySearchTerm)||(c.name||'').toUpperCase().includes(entitySearchTerm));
    res.textContent=found.length>0?`✅ وُجد ${found.length} نتيجة`:'❌ لا توجد نتائج';
    res.style.color=found.length>0?'#166534':'#DC2626';
  } else res.textContent='';
}
function clearEntitySearch(){
  document.getElementById('entity-search').value='';
  entitySearchTerm='';
  document.getElementById('entity-search-result').textContent='';
  renderList();
}

// ── Manager Panel ──────────────────────────
async function openMgrPanel(){
  document.getElementById('mgrPanel').style.display='flex';
  const content=document.getElementById('mgrContent');
  content.textContent='جاري التحميل...';
  try{
    const rows=await dbGet('mylist_feedback','?select=entity_id,emp_code,feedback,notes,updated_at');
    const fbMap={};
    rows.forEach(r=>fbMap[r.entity_id]=r);
    const byEmp={};
    Object.entries(window.MY_LIST||{}).forEach(([code,clients])=>{
      byEmp[code]={name:EMP_NAMES[code]||code,total:0,pending:0,contacted:0,success:0};
      clients.forEach(c=>{
        byEmp[code].total++;
        const r=fbMap[c.entityId];
        if(!r||!r.feedback)byEmp[code].pending++;
        else{
          byEmp[code].contacted++;
          if(r.feedback==='تم رفع طلب التمويل بنجاح')byEmp[code].success++;
        }
      });
    });
    let h='<table class="rep"><thead><tr><th>الموظف</th><th>الإجمالي</th><th>بانتظار</th><th>تم التواصل</th><th>نجح 🏆</th></tr></thead><tbody>';
    Object.entries(byEmp).forEach(([code,d])=>{
      h+=`<tr><td>${d.name}</td><td>${d.total}</td><td>${d.pending}</td><td>${d.contacted}</td><td style="font-weight:800;color:#166534;">${d.success}</td></tr>`;
    });
    h+='</tbody></table>';
    content.innerHTML=h;
  }catch(e){
    console.error(e);
    content.innerHTML='<div style="color:#DC2626;">⚠️ تعذّر تحميل البيانات، تأكد من الاتصال</div>';
  }
}
function closeMgrPanel(){document.getElementById('mgrPanel').style.display='none';}

async function exportMgrExcel(){
  let rows;
  try{
    rows=await dbGet('mylist_feedback','?select=entity_id,emp_code,feedback,notes,updated_at');
  }catch(e){
    alert('⚠️ تعذّر تحميل البيانات');
    return;
  }
  const fbMap={};
  rows.forEach(r=>fbMap[r.entity_id]=r);

  const byEmp={};
  const detailRows=[];
  Object.entries(window.MY_LIST||{}).forEach(([code,clients])=>{
    byEmp[code]=byEmp[code]||{name:EMP_NAMES[code]||code,total:0,pending:0,contacted:0,success:0};
    clients.forEach(c=>{
      const r=fbMap[c.entityId];
      const fb=r?r.feedback:'';
      byEmp[code].total++;
      if(!fb)byEmp[code].pending++;else{byEmp[code].contacted++;if(fb==='تم رفع طلب التمويل بنجاح')byEmp[code].success++;}
      detailRows.push({
        'الموظف':EMP_NAMES[code]||code,
        'كود الموظف':code,
        'اسم العميل':c.name,
        'TID':c.tid||'',
        'Entity ID':c.entityId,
        'التصنيف':c.category,
        'الفئة':c.grade||'',
        'المنطقة':c.zone,
        'المبلغ المتوقع':c.amount||'',
        'الفيدباك':fb||'لم يُحدَّد',
        'ملاحظات الموظف':r?(r.notes||''):'',
        'آخر تحديث':r?r.updated_at:''
      });
    });
  });
  const summaryData=Object.values(byEmp).map(d=>({
    'الموظف':d.name,'الإجمالي':d.total,'بانتظار التواصل':d.pending,'تم التواصل':d.contacted,'نجح الطلب':d.success
  }));

  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(summaryData);
  const ws2=XLSX.utils.json_to_sheet(detailRows);
  XLSX.utils.book_append_sheet(wb,ws1,'ملخص الأداء');
  XLSX.utils.book_append_sheet(wb,ws2,'تفاصيل العملاء');
  const today=new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb,'تقرير_My_List_'+today+'.xlsx');
}

// ── Init ──────────────────────────────────
async function init(){
  if(!mlUser)return;
  if(isSup)document.getElementById('mgrBtn').style.display='flex';
  try{
    const q = isSup ? '?select=entity_id,feedback,notes' : '?select=entity_id,feedback,notes&emp_code=eq.'+encodeURIComponent(mlUser.code);
    const rows=await dbGet('mylist_feedback',q);
    rows.forEach(r=>{feedback[r.entity_id]=r.feedback;notes[r.entity_id]=r.notes;});
  }catch(e){console.error(e);}
  if(window.MY_LIST){renderList();}
  else{
    document.getElementById('clients-list').innerHTML='<div style="text-align:center;padding:40px;"><div style="font-size:36px;">⏳</div><div>جاري التحميل...</div></div>';
    const chk=setInterval(()=>{if(window.MY_LIST){clearInterval(chk);renderList();}},200);
  }
}
init();
